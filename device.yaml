  name: hdsp2112
  friendly_name: HDSP2112-Clock

esp32:
  board: esp32dev
#  framework:
#    type: arduino

logger:

api:
  encryption:
    key: "wkRJEJ5RBxBrLxx2Gl3H0jX40IH+TA7yUHlWzuZ07hc="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: CoolClock Fallback Hotspot
    password: "UKhyBXOW3rLD"

captive_portal:


web_server:
  port: 80

external_components:
  - source:
      type: local
      path: /components


hdsp2112:
  id: hdsp



text:
  - platform: template
    name: "HDSP2112 Text"
    id: hdsp_text
    optimistic: true
    mode: text

    set_action:
      - lambda: |-
          id(hdsp).set_text(x);

number:
  - platform: template
    name: "HDSP2112 Brightness"
    id: hdsp_brightness
    min_value: 1
    max_value: 7
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 7

    set_action:
      - lambda: |-
          if(!id(is_enabled).state) {
            id(hdsp).set_brightness(0);
            return;
          };
          id(hdsp).set_brightness((int)x);

    on_value:
      - delay: 5s
      - lambda: |-
          if(!id(is_enabled).state) {
            id(hdsp).set_brightness(0);
            return;
          };
          id(hdsp).set_brightness((int)x);

switch:
  - platform: template
    name: "Show Day"
    id: show_day
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Is Clock"
    id: is_clock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Enable"
    id: is_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      - lambda: |-
          id(hdsp).set_brightness(0);
    turn_on_action:
      - lambda: |-
          id(hdsp).set_brightness((int)id(hdsp_brightness).state);
button:
  - platform: restart
    name: Reboot

  - platform: template
    name: "HDSP2112 Self Test"

    on_press:
      - lambda: |-
          id(hdsp).self_test();


time:
  - platform: sntp
    id: ha_time
    timezone: "Europe/Berlin"
    on_time_sync:
      - then:
        - delay: 100ms
        - lambda: |-
            auto now = id(ha_time).now();
            ESP_LOGI("clock", "Time acquired: %02d:%02d:%02d", now.hour, now.minute, now.second);
    on_time:
      - seconds: /1
        then:
          - delay: 5s
          - lambda: |-
              if(!id(is_clock).state) return;
              if(!id(is_enabled).state) return;

              auto now = id(ha_time).now();
              if (!now.is_valid())
                return;

              std::string day = id(show_day).state ? now.strftime("%a") : "  ";
              std::string divider = now.second % 2 == 0 ? ":" : " ";
              std::string format = "%H" + divider + "%M" + "      _";
              std::string time = now.strftime(format);

              char text[16];
              snprintf(
                text,
                sizeof(text),
                "%s%s",
                day.c_str(),
                time.c_str()
              );

              id(hdsp).setChar(" ", 1);
              id(hdsp).setChar(" ", 7);
              id(hdsp).set_text(text);
